name: size-watchdog

# 体积看门狗（计划书 §9.3 / §10 M5）
# 门槛：安装包 ≤ 120MB；解包目录 ≤ 400MB；整个 release/ ≤ 550MB
# 同时强制「唯一产物目录 + 只保留最新一份」：release/ 里不允许出现 *.tmp
# 与多个安装包（历史上 release/ 与 release_build/ 分裂过）。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - '.github/workflows/size-watchdog.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - '.github/workflows/size-watchdog.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # dist:win 内部已经串了 clean:release，这里不再重复清理
      - name: Build installer (NSIS)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Report & enforce size budget
        shell: pwsh
        run: |
          $installerLimitMB = 120
          $unpackedLimitMB = 400
          $releaseLimitMB = 550

          if (-not (Test-Path 'release')) { throw '构建后没有 release 目录' }

          # 只保留最新一份：不允许 *.tmp 残留（上一次失败构建的指纹）
          $tmpDirs = Get-ChildItem release -Directory -Filter '*.tmp' -ErrorAction SilentlyContinue
          if ($tmpDirs) { throw "release/ 存在临时残留（构建曾失败）：$($tmpDirs.Name -join ', ')" }

          $setups = @(Get-ChildItem release -Filter '*-setup.exe' | Sort-Object LastWriteTime -Descending)
          if ($setups.Count -eq 0) { throw '未找到安装包产物（release/*-setup.exe）' }
          if ($setups.Count -gt 1) { throw "release/ 里有多份安装包（应只保留最新一份）：$($setups.Name -join ', ')" }
          $setup = $setups[0]
          $installerMB = [math]::Round($setup.Length / 1MB, 1)

          $dir = 'release/win-unpacked'
          if (-not (Test-Path $dir)) { throw '未找到解包目录 release/win-unpacked' }
          if (-not (Test-Path (Join-Path $dir 'Inkwell.exe'))) { throw 'release/win-unpacked 缺少 Inkwell.exe（构建被中断过？）' }
          $unpackedBytes = (Get-ChildItem $dir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $unpackedMB = [math]::Round($unpackedBytes / 1MB, 1)

          $releaseBytes = (Get-ChildItem release -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $releaseMB = [math]::Round($releaseBytes / 1MB, 1)

          $summary = @"
          ### 体积看门狗
          | 指标 | 实测 | 门槛 |
          |---|---|---|
          | 安装包 $($setup.Name) | ${installerMB} MB | ≤ ${installerLimitMB} MB |
          | 解包体积 | ${unpackedMB} MB | ≤ ${unpackedLimitMB} MB |
          | release/ 总计 | ${releaseMB} MB | ≤ ${releaseLimitMB} MB |
          "@
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          Write-Host $summary

          $failed = $false
          if ($installerMB -gt $installerLimitMB) { Write-Error "安装包体积超标：${installerMB}MB > ${installerLimitMB}MB"; $failed = $true }
          if ($unpackedMB -gt $unpackedLimitMB) { Write-Error "解包体积超标：${unpackedMB}MB > ${unpackedLimitMB}MB"; $failed = $true }
          if ($releaseMB -gt $releaseLimitMB) { Write-Error "release/ 总体积超标：${releaseMB}MB > ${releaseLimitMB}MB"; $failed = $true }
          if ($failed) { exit 1 }
